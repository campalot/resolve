<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 900"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Resolve logo</title>
  <desc id="desc">Three connected workflow nodes progressing from neutral gray to a green completion checkmark, with the Resolve wordmark below.</desc>

  <style>
    :root {
      --resolve-neutral: #6B7280;
      --resolve-success: #16A34A;
      --resolve-text: #101820;
    }

    .neutral {
      stroke: var(--resolve-neutral);
    }

    .success {
      stroke: var(--resolve-success);
    }

    .wordmark {
      fill: var(--resolve-text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      font-size: 164px;
      font-weight: 600;
      letter-spacing: -6px;
    }
  </style>

  <!-- Workflow connections -->
  <line x1="290" y1="350" x2="505" y2="350"
        class="neutral" stroke-width="18" stroke-linecap="round"/>
  <line x1="595" y1="350" x2="810" y2="350"
        class="success" stroke-width="18" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="245" cy="350" r="68"
          fill="white" class="neutral" stroke-width="18"/>
  <circle cx="550" cy="350" r="68"
          fill="white" class="neutral" stroke-width="18"/>

  <!-- Completion node -->
  <circle cx="885" cy="350" r="95"
          fill="white" class="success" stroke-width="18"/>

  <!-- Checkmark -->
  <path d="M842 350 L875 383 L936 318"
        fill="none" class="success"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="600" y="620" text-anchor="middle" class="wordmark">Resolve</text>
</svg>
